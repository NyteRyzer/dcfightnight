name: Test & Build (Windows, macOS, Linux)

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot and export templates
        run: |
          set -e
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          TPL="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TPL"
          unzip -q -j "Godot_v${GODOT_VERSION}-stable_export_templates.tpz" \
            templates/version.txt templates/linux_release.x86_64 templates/linux_debug.x86_64 \
            templates/windows_release_x86_64.exe templates/windows_debug_x86_64.exe templates/macos.zip -d "$TPL"
          rm -f ./*.tpz ./*.zip

      - name: Import project
        run: godot --headless --path . --import || true

      - name: Run tests
        run: |
          godot --headless --path . --fixed-fps 60 res://tests/TestRunner.tscn -- quick
          godot --headless --path . --fixed-fps 60 res://tests/FlowTest.tscn

      - name: Export Windows, macOS and Linux
        run: |
          set -e
          mkdir -p build/windows build/macos build/linux
          godot --headless --path . --export-release "Windows Desktop" build/windows/FightNight.exe
          godot --headless --path . --export-release "macOS" build/macos/FightNight.zip
          godot --headless --path . --export-release "Linux" build/linux/FightNight.x86_64
          chmod +x build/linux/FightNight.x86_64
          test -s build/windows/FightNight.exe
          test -s build/macos/FightNight.zip
          test -s build/linux/FightNight.x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: FightNight-Windows
          path: build/windows/
      - uses: actions/upload-artifact@v4
        with:
          name: FightNight-macOS
          path: build/macos/FightNight.zip
      - uses: actions/upload-artifact@v4
        with:
          name: FightNight-Linux
          path: build/linux/
